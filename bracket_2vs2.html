<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bracket · Torneo 2 VS 2 · Team Crow Power</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --fondo:       #0d0b2b;
      --oro:         #ffd23f;
      --oro-fuerte:  #ff9e00;
      --azul:        #2ec5ff;
      --rosa:        #ff3d81;
      --texto:       #ffffff;
      --tarjeta:     rgba(255,255,255,0.06);
      --borde:       rgba(255,255,255,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      color: var(--texto);
      background:
        radial-gradient(circle at 20% 0%, rgba(46,197,255,.22), transparent 40%),
        radial-gradient(circle at 80% 10%, rgba(255,61,129,.22), transparent 40%),
        linear-gradient(160deg, rgba(13,11,43,.92), rgba(27,17,72,.92)),
        url('imagenes/WhatsApp Image 2025-06-26 at 10.01.18 PM.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        radial-gradient(2px 2px at 10% 20%, #fff, transparent),
        radial-gradient(2px 2px at 70% 40%, #fff, transparent),
        radial-gradient(1px 1px at 40% 80%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 90% 70%, #fff, transparent);
      opacity: .3; z-index: -1;
      animation: parpadeo 4s ease-in-out infinite alternate;
    }
    @keyframes parpadeo { from{opacity:.15} to{opacity:.45} }

    /* ── CONTENIDO ── */
    .contenedor {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 16px 60px;
      text-align: center;
      animation: aparecer .8s ease;
    }

    .titulo-pagina {
      font-family: 'Lilita One', cursive;
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: var(--oro);
      text-shadow: 3px 3px 0 var(--oro-fuerte), 5px 5px 0 rgba(0,0,0,.35);
      margin-bottom: 6px;
    }
    .subtitulo {
      color: #cdd3ff; font-size: 1rem;
      font-style: italic; margin-bottom: 24px;
    }

    /* ── BARRA DE HERRAMIENTAS ── */
    .toolbar {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .btn-tool {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      color: #fff; font-family: 'Nunito', sans-serif;
      font-weight: 700; font-size: .85rem;
      padding: 8px 16px; border-radius: 999px;
      cursor: pointer; transition: background .2s, transform .15s;
      text-decoration: none;
    }
    .btn-tool:hover { background: var(--rosa); transform: translateY(-2px); }

    /* ── VISOR DEL BRACKET ── */
    .bracket-wrapper {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 20px;
      padding: 16px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      overflow: hidden;
    }

    .bracket-scroll {
      overflow: auto;
      border-radius: 12px;
      cursor: zoom-in;
      scrollbar-width: thin;
      scrollbar-color: var(--rosa) rgba(255,255,255,.08);
    }
    .bracket-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
    .bracket-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,.05); border-radius: 3px; }
    .bracket-scroll::-webkit-scrollbar-thumb { background: var(--rosa); border-radius: 3px; }

    .bracket-scroll img {
      display: block;
      min-width: 720px;
      width: 100%;
      height: auto;
      border-radius: 10px;
      transition: transform .2s ease;
      transform-origin: top left;
      user-select: none;
    }
    .bracket-scroll.zoom-on { cursor: zoom-out; }
    .bracket-scroll.zoom-on img { width: auto; min-width: unset; }

    .bracket-pie { margin-top: 12px; font-size: .82rem; color: #9aa0d4; }

    /* ── LIGHTBOX ── */
    #lightbox {
      display: none;
      position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,.93);
      align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    #lightbox.visible { display: flex; }
    #lightbox img {
      max-width: 95vw; max-height: 95vh;
      object-fit: contain; border-radius: 12px;
      box-shadow: 0 0 60px rgba(255,61,129,.25);
      cursor: default;
    }
    #lightbox .cerrar {
      position: absolute; top: 16px; right: 20px;
      font-size: 2rem; color: #fff; cursor: pointer;
      background: rgba(255,255,255,.1);
      border: none; border-radius: 50%;
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s;
    }
    #lightbox .cerrar:hover { background: var(--rosa); }
    #lightbox .instruccion {
      position: absolute; bottom: 16px;
      left: 50%; transform: translateX(-50%);
      color: #9aa0d4; font-size: .8rem;
      background: rgba(0,0,0,.5);
      padding: 6px 14px; border-radius: 999px;
    }

    /* ── BOTÓN VOLVER ── */
    .btn-volver {
      display: inline-flex; align-items: center; gap: 8px;
      margin-top: 24px; text-decoration: none; color: #fff;
      background: var(--tarjeta); border: 1px solid var(--borde);
      border-radius: 999px; padding: 10px 22px;
      font-weight: 700; font-size: .95rem;
      transition: background .2s, transform .2s;
    }
    .btn-volver:hover { background: var(--rosa); transform: translateY(-3px); }

    @keyframes aparecer { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
  </style>
</head>
<body>

  <!-- LIGHTBOX -->
  <div id="lightbox">
    <button class="cerrar" id="cerrarLightbox" aria-label="Cerrar">✕</button>
    <img id="lightboxImg" src="imagenes/actual_2vs2.png" alt="Bracket 2vs2 ampliado">
    <span class="instruccion">Haz clic fuera o presiona ESC para cerrar · Pellizca para hacer zoom</span>
  </div>

  <!-- CONTENIDO -->
  <div class="contenedor">
    <h1 class="titulo-pagina">🏆 Bracket · 2 VS 2</h1>
    <p class="subtitulo">8 equipos · Cuartos → Semifinal → Final · Team Crow Power</p>

    <div class="toolbar">
      <button class="btn-tool" id="btnZoom">🔍 Ampliar imagen</button>
      <button class="btn-tool" id="btnFullscreen">⛶ Pantalla completa</button>
    </div>

    <div class="bracket-wrapper">
      <div class="bracket-scroll" id="bracketScroll">
        <img id="bracketImg" src="imagenes/actual_2vs2.png" alt="Bracket actual del torneo 2vs2"
             draggable="false">
      </div>
      <p class="bracket-pie">📸 Haz clic en la imagen para ampliarla · Revisa este bracket durante el torneo</p>
    </div>

    <a class="btn-volver" href="index.html">← Volver al inicio</a>
  </div>

  <script>
    // ── Lightbox (clic en imagen) ──
    const lightbox       = document.getElementById('lightbox');
    const bracketImg     = document.getElementById('bracketImg');
    const cerrarLightbox = document.getElementById('cerrarLightbox');

    function abrirLightbox() { lightbox.classList.add('visible'); document.body.style.overflow = 'hidden'; }
    function cerrarLB()      { lightbox.classList.remove('visible'); document.body.style.overflow = ''; }

    bracketImg.addEventListener('click', abrirLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) cerrarLB(); });
    cerrarLightbox.addEventListener('click', cerrarLB);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarLB(); });

    // ── Botón "Ampliar imagen" (zoom 2×) ──
    const bracketScroll = document.getElementById('bracketScroll');
    const btnZoom = document.getElementById('btnZoom');
    let zoomOn = false;
    btnZoom.addEventListener('click', () => {
      zoomOn = !zoomOn;
      if (zoomOn) {
        bracketImg.style.width = '200%';
        bracketImg.style.minWidth = 'unset';
        bracketScroll.classList.add('zoom-on');
        btnZoom.textContent = '🔍 Zoom normal';
      } else {
        bracketImg.style.width = '100%';
        bracketImg.style.minWidth = '720px';
        bracketScroll.classList.remove('zoom-on');
        btnZoom.textContent = '🔍 Ampliar imagen';
      }
    });

    // ── Botón pantalla completa ──
    const btnFull = document.getElementById('btnFullscreen');
    btnFull.addEventListener('click', () => {
      const el = document.getElementById('bracketScroll');
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch(() => abrirLightbox());
        btnFull.textContent = '⛶ Salir de pantalla completa';
      } else {
        document.exitFullscreen();
        btnFull.textContent = '⛶ Pantalla completa';
      }
    });
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) btnFull.textContent = '⛶ Pantalla completa';
    });
  </script>

  <script src="menu.js"></script>
</body>
</html>
