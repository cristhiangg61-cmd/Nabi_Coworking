<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Torneo 2vs2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; overflow-x: hidden; }
        .bracket-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .bracket-inner { display: flex; justify-content: center; align-items: center; gap: 0; min-width: 800px; padding-bottom: 8px; }

        /* ── Estilos reutilizables para botones de control ── */
        .btn-ctrl {
            background: #141435;
            border: 1px solid #3a3a60;
            border-radius: 7px;
            color: #9090cc;
            font-size: 11px;
            padding: 5px 14px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: background 0.15s, color 0.15s;
        }
        .btn-ctrl:hover:not(:disabled) { background: #1e1e50; color: #b0b0ee; }
        .btn-ctrl:disabled { color: #333355; cursor: default; }

        /* ── Estilos reutilizables para botones de modal ── */
        .btn-modal-team {
            border-radius: 9px;
            padding: 12px 16px;
            cursor: pointer;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            min-width: 120px;
            flex: 1 1 120px;
            font-family: inherit;
            transition: filter 0.15s;
        }
        .btn-modal-team:hover { filter: brightness(1.2); }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Fijado a Babel 7: Babel 8 cambió el runtime JSX a "automatic" y genera
         un import que rompe los <script type="text/babel"> (pantalla en blanco). -->
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    
    <script type="text/babel">
        // FIX #6: Removido useCallback que no se usaba
        const { useState, useMemo, useEffect } = React;

        const STORAGE_KEY = "torneo2vs2_estado";

        const EQUIPOS_DEFAULT = [
          ["Jugador 1","Jugador 2"],
          ["Jugador 3","Jugador 4"],
          ["Jugador 5","Jugador 6"],
          ["Jugador 7","Jugador 8"],
          ["Jugador 9","Jugador 10"],
          ["Jugador 11","Jugador 12"],
          ["Jugador 13","Jugador 14"],
          ["Jugador 15","Jugador 16"],
        ];

        const C = {
          bg:        "#080812",
          panelBg:   "#0d0d1e",
          azul_bg:   "#0e1f3d",
          azul_bd:   "#2d6fdd",
          azul_tx:   "#7ab8ff",
          rojo_bg:   "#3d0e0e",
          rojo_bd:   "#dd2d2d",
          rojo_tx:   "#ff7a7a",
          win_bg:    "#0e2e1a",
          win_bd:    "#27a050",
          win_tx:    "#50e87a",
          champ_bg:  "#2a1a00",
          champ_bd:  "#cc8800",
          champ_tx:  "#ffd700",
          silver_bg: "#1c1c1c",
          silver_bd: "#909090",
          silver_tx: "#d0d0d0",
          bronze_bg: "#2a1400",
          bronze_bd: "#a05a20",
          bronze_tx: "#cd7f32",
          empty_bg:  "#0d0d20",
          empty_bd:  "#282845",
          empty_tx:  "#3a3a60",
          done_bg:   "#111128",
          done_bd:   "#3a3a6a",
          done_tx:   "#5a5a9a",
          line:      "#2a2a5a",
          header:    "#b0b4e0",
          title:     "#e0e4ff",
        };

        // ─── HELPER: nombres de equipo ───────────────────────────────────────
        function eqName(eq) {
          if (!eq) return "???";
          return `${eq[0]} & ${eq[1]}`;
        }

        // FIX #5: Función de comparación robusta en lugar de JSON.stringify directo
        function eqEquals(a, b) {
          if (!a || !b) return false;
          return a[0] === b[0] && a[1] === b[1];
        }

        function eqKey(eq) {
          return eq ? `${eq[0]}|${eq[1]}` : "null";
        }

        // ─── ESTADO INICIAL ──────────────────────────────────────────────────
        function initState(equipos) {
          return {
            wb: [
              equipos.map(e => [...e]),
              [null,null,null,null],
              [null,null],
              [null],
            ],
            semifinal_losers: [null, null],
            tercero: null,
            cuarto: null,
          };
        }

        // ─── Reconstruir estado re-mapeando nombres de equipo ────────────────
        function remapState(oldEqs, newEqs, oldSt) {
          function findIdx(eqArr) {
            if (!eqArr) return -1;
            // FIX #5: Usar eqEquals en lugar de JSON.stringify
            return oldEqs.findIndex(e => eqEquals(e, eqArr));
          }

          function remap(eq) {
            if (!eq) return null;
            const idx = findIdx(eq);
            if (idx === -1) return eq;
            return [...newEqs[idx]];
          }

          return {
            wb: [
              newEqs.map(e => [...e]),
              oldSt.wb[1].map(remap),
              oldSt.wb[2].map(remap),
              oldSt.wb[3].map(remap),
            ],
            semifinal_losers: oldSt.semifinal_losers.map(remap),
            tercero: remap(oldSt.tercero),
            cuarto:  remap(oldSt.cuarto),
          };
        }

        // ─── PARTIDOS ────────────────────────────────────────────────────────
        // FIX #4: buildPartidos se usa con useMemo para no reconstruir en cada render
        function buildPartidos() {
          const ps = [];
          for (let i = 0; i < 4; i++) {
            ps.push({ etapa: "CUARTOS", label: `Cuartos ${i+1}`, r: 0, j: i,
              src1: [0, 2*i], src2: [0, 2*i+1], dst_win: [1, i], dst_lose: null });
          }
          for (let i = 0; i < 2; i++) {
            ps.push({ etapa: "SEMIFINAL", label: `Semifinal ${i+1}`, r: 1, j: i,
              src1: [1, 2*i], src2: [1, 2*i+1], dst_win: [2, i], dst_lose: "semi_loser", dst_lose_idx: i });
          }
          ps.push({ etapa: "3ER PUESTO", label: "3er Puesto", r: "3p",
            src1: "semi_loser_0", src2: "semi_loser_1", dst_win: "tercero", dst_lose: "cuarto" });
          ps.push({ etapa: "GRAN FINAL", label: "Gran Final", r: 2,
            src1: [2, 0], src2: [2, 1], dst_win: [3, 0], dst_lose: null });
          return ps;
        }

        // Partidos estáticos — no dependen de los equipos
        const PARTIDOS = buildPartidos();

        function resolveTeam(st, src) {
          if (Array.isArray(src)) return st.wb[src[0]][src[1]];
          if (src === "semi_loser_0") return st.semifinal_losers[0];
          if (src === "semi_loser_1") return st.semifinal_losers[1];
          return null;
        }

        function applyResult(st, p, winner, loser) {
          const ns = JSON.parse(JSON.stringify(st));
          if (Array.isArray(p.dst_win)) ns.wb[p.dst_win[0]][p.dst_win[1]] = winner;
          if (p.dst_lose === "semi_loser") ns.semifinal_losers[p.dst_lose_idx] = loser;
          if (p.r === "3p") { ns.tercero = winner; ns.cuarto = loser; }
          if (p.r === 2)    { ns.wb[3][0] = winner; }
          return ns;
        }

        function getSubcampeon(st) {
          const fin = st.wb[2];
          const champ = st.wb[3][0];
          if (!champ || !fin[0] || !fin[1]) return null;
          // FIX #5: usar eqEquals
          return eqEquals(champ, fin[0]) ? fin[1] : fin[0];
        }

        // ─── PERSISTENCIA localStorage ───────────────────────────────────────
        // FIX #8: Guardar y restaurar estado automáticamente
        function saveToStorage(data) {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
        }

        function loadFromStorage() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : null;
          } catch(e) { return null; }
        }

        // ─── COMPONENTES VISUALES ────────────────────────────────────────────
        const BW = 152;

        // FIX #11: Indicador de partido terminado (overlay sutil en bloques perdedores)
        function TeamBlock({ eq, style, width = 160, compact = false, onClick, clickable = false, isDone = false }) {
          const pad = compact ? 3 : 6;
          const h1 = compact ? 18 : 22;
          const total = h1 * 2 + pad * 3;
          const numSize = compact ? 9 : 10;
          const nameSize = compact ? 10 : 12;

          let bg, bd, tx;
          if (!eq) {
            bg = C.empty_bg; bd = C.empty_bd; tx = C.empty_tx;
          } else if (isDone) { bg = C.done_bg; bd = C.done_bd; tx = C.done_tx; }
          else if (style === "azul")   { bg = C.azul_bg;   bd = C.azul_bd;   tx = C.azul_tx; }
          else if (style === "rojo")   { bg = C.rojo_bg;   bd = C.rojo_bd;   tx = C.rojo_tx; }
          else if (style === "win")    { bg = C.win_bg;    bd = C.win_bd;    tx = C.win_tx; }
          else if (style === "final_w"){ bg = C.azul_bg;   bd = C.champ_bd;  tx = C.champ_tx; }
          else if (style === "champ")  { bg = C.champ_bg;  bd = C.champ_bd;  tx = C.champ_tx; }
          else if (style === "silver") { bg = C.silver_bg; bd = C.silver_bd; tx = C.silver_tx; }
          else if (style === "bronze") { bg = C.bronze_bg; bd = C.bronze_bd; tx = C.bronze_tx; }
          else { bg = C.empty_bg; bd = C.empty_bd; tx = C.empty_tx; }

          const j1 = eq ? eq[0] : "";
          const j2 = eq ? eq[1] : "";

          return (
            <div
              onClick={clickable && eq ? onClick : undefined}
              style={{
                width, height: total,
                background: bg,
                border: `1.5px ${eq ? "solid" : "dashed"} ${bd}`,
                borderRadius: 8,
                overflow: "hidden",
                display: "flex",
                flexDirection: "column",
                opacity: eq ? (isDone ? 0.45 : 1) : 0.55,
                flexShrink: 0,
                cursor: clickable && eq ? "pointer" : "default",
                transition: "filter 0.15s",
                position: "relative",
              }}
              onMouseEnter={e => { if(clickable && eq) e.currentTarget.style.filter = "brightness(1.25)"; }}
              onMouseLeave={e => { e.currentTarget.style.filter = "none"; }}
            >
              {/* FIX #11: Indicador visual "partido terminado" para perdedores */}
              {isDone && eq && (
                <div style={{
                  position: "absolute", inset: 0, display: "flex",
                  alignItems: "center", justifyContent: "center",
                  fontSize: 9, color: C.done_tx, fontWeight: 700,
                  letterSpacing: 1, pointerEvents: "none", zIndex: 2,
                }}>ELIMINADO</div>
              )}
              <div style={{
                flex: 1, display: "flex", alignItems: "center",
                padding: `0 ${pad + 2}px 0 ${pad}px`,
                borderBottom: `1px solid ${bd}44`,
              }}>
                <span style={{ color: tx, fontSize: numSize, fontWeight: 700, marginRight: 4, opacity: 0.7, flexShrink: 0 }}>①</span>
                <span style={{ color: isDone ? C.done_tx : "#fff", fontSize: nameSize, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{j1}</span>
              </div>
              <div style={{
                flex: 1, display: "flex", alignItems: "center",
                padding: `0 ${pad + 2}px 0 ${pad}px`,
              }}>
                <span style={{ color: isDone ? C.done_tx : "#ffb0b0", fontSize: numSize, fontWeight: 700, marginRight: 4, opacity: 0.7, flexShrink: 0 }}>②</span>
                <span style={{ color: isDone ? C.done_tx : "#fff", fontSize: nameSize, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{j2}</span>
              </div>
            </div>
          );
        }

        function ChampBlock({ eq, width = 200 }) {
          const h = 72;
          return (
            <div style={{
              width, height: h,
              background: C.champ_bg,
              border: `2px solid ${C.champ_bd}`,
              borderRadius: 10,
              overflow: "hidden",
              display: "flex",
              flexDirection: "column",
              boxShadow: eq ? `0 0 18px ${C.champ_bd}55` : "none",
              flexShrink: 0,
            }}>
              <div style={{ flex: 1, display: "flex", alignItems: "center", padding: "0 8px", borderBottom: `1px solid ${C.champ_bd}55` }}>
                <span style={{ color: C.champ_tx, fontSize: 10, fontWeight: 700, marginRight: 5, opacity: 0.8 }}>①</span>
                <span style={{ color: C.champ_tx, fontSize: 13, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{eq ? eq[0] : ""}</span>
              </div>
              <div style={{ flex: 1, display: "flex", alignItems: "center", padding: "0 8px" }}>
                <span style={{ color: "#ffb0b0", fontSize: 10, fontWeight: 700, marginRight: 5, opacity: 0.8 }}>②</span>
                <span style={{ color: C.champ_tx, fontSize: 13, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1 }}>{eq ? eq[1] : ""}</span>
              </div>
            </div>
          );
        }

        function ColHeader({ label, color = C.header }) {
          return (
            <div style={{ textAlign: "center", fontSize: 10, fontWeight: 700, color, letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 6 }}>
              {label}
            </div>
          );
        }

        function Medal({ pos }) {
          const m = {
            1: { bg: "#a07800", border: "#ffd700", text: "#ffd700", label: "ORO" },
            2: { bg: "#505050", border: "#d0d0d0", text: "#d0d0d0", label: "PLATA" },
            3: { bg: "#7a4500", border: "#cd7f32", text: "#cd7f32", label: "BRONCE" },
          }[pos];
          if (!m) return null;
          return (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 40 }}>
              <div style={{
                width: 32, height: 32, borderRadius: "50%",
                background: m.bg, border: `2px solid ${m.border}`,
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 13, fontWeight: 700, color: "#fff",
              }}>{pos}</div>
              <div style={{ fontSize: 8, fontWeight: 700, color: m.text, marginTop: 3 }}>{m.label}</div>
            </div>
          );
        }

        // ─── MODAL ¿QUIÉN AVANZA? ────────────────────────────────────────────
        function MatchModal({ eq1, eq2, label, onChoose, onClose }) {
          return (
            <div style={{
              position: "fixed", inset: 0, background: "#000000aa",
              display: "flex", alignItems: "center", justifyContent: "center",
              zIndex: 100, padding: "12px",
            }} onClick={onClose}>
              <div style={{
                background: "#13132a", border: `1.5px solid ${C.azul_bd}`,
                borderRadius: 14, padding: "24px 20px",
                width: "100%", maxWidth: 380, textAlign: "center",
              }} onClick={e => e.stopPropagation()}>
                {label && (
                  <div style={{ color: "#5a5a8a", fontSize: 10, fontWeight: 700, letterSpacing: 2, marginBottom: 4, textTransform: "uppercase" }}>
                    {label}
                  </div>
                )}
                <div style={{ color: C.champ_tx, fontSize: 13, fontWeight: 700, letterSpacing: 2, marginBottom: 18, textTransform: "uppercase" }}>
                  ¿Quién avanza?
                </div>
                <div style={{ display: "flex", gap: 12, justifyContent: "center", alignItems: "center", flexWrap: "wrap" }}>
                  {/* FIX #7: Estilos extraídos a clase CSS .btn-modal-team */}
                  <button onClick={() => onChoose(eq1, eq2)} className="btn-modal-team"
                    style={{ background: C.azul_bg, border: `1.5px solid ${C.azul_bd}` }}>
                    <div style={{ color: C.azul_tx, fontSize: 10, fontWeight: 700, marginBottom: 4 }}>① {eq1[0]}</div>
                    <div style={{ color: "#fff", fontSize: 10, marginBottom: 10 }}>② {eq1[1]}</div>
                    <div style={{ color: C.win_tx, fontSize: 11, fontWeight: 700 }}>✓ Avanza</div>
                  </button>
                  <div style={{ color: "#444488", fontSize: 13, fontWeight: 700 }}>VS</div>
                  <button onClick={() => onChoose(eq2, eq1)} className="btn-modal-team"
                    style={{ background: C.rojo_bg, border: `1.5px solid ${C.rojo_bd}` }}>
                    <div style={{ color: C.rojo_tx, fontSize: 10, fontWeight: 700, marginBottom: 4 }}>① {eq2[0]}</div>
                    <div style={{ color: "#fff", fontSize: 10, marginBottom: 10 }}>② {eq2[1]}</div>
                    <div style={{ color: C.win_tx, fontSize: 11, fontWeight: 700 }}>✓ Avanza</div>
                  </button>
                </div>
                <button onClick={onClose} style={{
                  marginTop: 18, background: "transparent", border: "none",
                  color: "#555588", fontSize: 12, cursor: "pointer", fontFamily: "inherit",
                }}>Cancelar</button>
              </div>
            </div>
          );
        }

        // ─── LADO DEL BRACKET ────────────────────────────────────────────────
        function BracketSide({ side, st, onMatchClick }) {
          const isLeft = side === "left";
          const idx0 = isLeft ? 0 : 4;
          const sty0 = isLeft ? "azul" : "rojo";
          const sideLabel = isLeft ? "LADO AZUL" : "LADO ROJO";
          const sideColor = isLeft ? C.azul_bd : C.rojo_bd;

          const oct  = st.wb[0];
          const semi = st.wb[1];

          const quartSlots = [0,1,2,3].map(i => oct[idx0 + i]);
          const semiSlots  = [0,1].map(i => semi[(isLeft?0:2) + i]);

          const qH   = 52;
          const qGap = 20;
          const pairH = qH * 2 + qGap;

          function canQuarters(pIdx) {
            const ai = idx0 + 2*pIdx, bi = idx0 + 2*pIdx + 1;
            return oct[ai] && oct[bi];
          }

          function canSemi(sIdx) {
            const ai = (isLeft?0:2) + 2*sIdx, bi = ai+1;
            return semi[ai] && semi[bi];
          }

          return (
            <div style={{ display: "flex", flexDirection: isLeft?"row":"row-reverse", alignItems: "flex-start", gap: 0 }}>
              {/* ─── CUARTOS ─── */}
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: sideColor, letterSpacing: 2, textTransform: "uppercase", marginBottom: 8 }}>
                  {sideLabel}
                </div>
                <ColHeader label="Cuartos" color={C.header} />
                <div style={{ display: "flex", flexDirection: "column", gap: qGap }}>
                  {quartSlots.map((eq, i) => {
                    const pIdx = Math.floor(i / 2);
                    const semiSlotIdx = (isLeft?0:2) + pIdx;
                    const semiResult = st.wb[1][semiSlotIdx];
                    // FIX #5: usar eqEquals para comparar ganador
                    const isWinner = eq && semiResult && eqEquals(eq, semiResult);
                    // FIX #11: perdedor del partido = tiene equipo, hay resultado, pero no es el ganador
                    const isLoser = eq && semiResult && !eqEquals(eq, semiResult);
                    const sty = eq ? (isWinner ? "win" : sty0) : sty0;
                    const clickable = canQuarters(pIdx) && !semiResult;
                    return (
                      <TeamBlock
                        key={i}
                        eq={eq} style={sty} width={BW} compact
                        clickable={clickable}
                        isDone={!!isLoser}
                        onClick={() => {
                          const ai = idx0 + 2*pIdx, bi = idx0 + 2*pIdx + 1;
                          onMatchClick(oct[ai], oct[bi], "CUARTOS");
                        }}
                      />
                    );
                  })}
                </div>
              </div>

              {/* ─── CONECTORES CUARTOS→SEMI ─── */}
              <div style={{ display: "flex", flexDirection: "column", gap: 0, alignItems: "center", width: 36, paddingTop: 36 }}>
                {[0,1].map(pIdx => {
                  const connH = pairH;
                  return (
                    <div key={pIdx} style={{ width: 36, height: connH + qGap }}>
                      <svg width="36" height={connH + qGap} style={{ overflow: "visible" }}>
                        {isLeft ? (
                          <>
                            <line x1="0" y1={qH/2} x2="18" y2={qH/2} stroke={C.line} strokeWidth="1.5"/>
                            <line x1="0" y1={qH+qGap+qH/2} x2="18" y2={qH+qGap+qH/2} stroke={C.line} strokeWidth="1.5"/>
                            <line x1="18" y1={qH/2} x2="18" y2={qH+qGap+qH/2} stroke={C.line} strokeWidth="1.5"/>
                            <line x1="18" y1={(qH/2+qH+qGap+qH/2)/2} x2="36" y2={(qH/2+qH+qGap+qH/2)/2} stroke={C.line} strokeWidth="1.5"/>
                          </>
                        ) : (
                          <>
                            <line x1="36" y1={qH/2} x2="18" y2={qH/2} stroke={C.line} strokeWidth="1.5"/>
                            <line x1="36" y1={qH+qGap+qH/2} x2="18" y2={qH+qGap+qH/2} stroke={C.line} strokeWidth="1.5"/>
                            <line x1="18" y1={qH/2} x2="18" y2={qH+qGap+qH/2} stroke={C.line} strokeWidth="1.5"/>
                            <line x1="18" y1={(qH/2+qH+qGap+qH/2)/2} x2="0" y2={(qH/2+qH+qGap+qH/2)/2} stroke={C.line} strokeWidth="1.5"/>
                          </>
                        )}
                      </svg>
                    </div>
                  );
                })}
              </div>

              {/* ─── SEMIFINAL ─── */}
              <div style={{ display: "flex", flexDirection: "column", alignItems: "center", paddingTop: 36 }}>
                <ColHeader label="Semifinal" color={C.header} />
                <div style={{ display: "flex", flexDirection: "column", gap: pairH + qGap - qH }}>
                  {semiSlots.map((eq, i) => {
                    // FIX #1 y #2: isWinner/sty corregidos usando el índice correcto
                    const finalSlotIdx = isLeft ? 0 : 1;
                    const finalResult = st.wb[2][finalSlotIdx];
                    const isWinner = eq && finalResult && eqEquals(eq, finalResult);
                    const isLoser  = eq && finalResult && !eqEquals(eq, finalResult);
                    // FIX #1: sty ya no siempre devuelve "win" — perdedores van a color de lado
                    const sty = eq ? (isWinner ? "win" : isLeft ? "azul" : "rojo") : (isLeft ? "azul" : "rojo");
                    const clickable = canSemi(i) && !finalResult;
                    return (
                      <TeamBlock
                        key={i}
                        eq={eq} style={sty} width={BW} compact
                        clickable={clickable}
                        isDone={!!isLoser}
                        onClick={() => {
                          const ai = (isLeft?0:2) + 2*i;
                          onMatchClick(semi[ai], semi[ai+1], "SEMIFINAL");
                        }}
                      />
                    );
                  })}
                </div>
              </div>
            </div>
          );
        }

        // ─── TORNEO PRINCIPAL ────────────────────────────────────────────────
        function Torneo2vs2() {
          // FIX #8: Inicializar desde localStorage si existe
          const [st, setSt] = useState(() => {
            const saved = loadFromStorage();
            return saved ? saved.st : initState(EQUIPOS_DEFAULT);
          });
          const [history, setHistory] = useState(() => {
            const saved = loadFromStorage();
            return saved ? saved.history : [];
          });
          const [equipos, setEquipos] = useState(() => {
            const saved = loadFromStorage();
            return saved ? saved.equipos : EQUIPOS_DEFAULT;
          });
          const [modal, setModal]       = useState(null);
          const [editing, setEditing]   = useState(false);
          const [editBuf, setEditBuf]   = useState(EQUIPOS_DEFAULT.map(e => [...e]));
          const [lastAction, setLastAction] = useState("Haz clic en un partido para registrar el ganador");

          // FIX #8: Guardar en localStorage cada vez que cambia el estado relevante
          useEffect(() => {
            saveToStorage({ st, history, equipos });
          }, [st, history, equipos]);

          const qH   = 52;
          const qGap = 20;
          const pairH = qH * 2 + qGap;

          // ── Derivados ──────────────────────────────────────────────────────
          const sub     = getSubcampeon(st);
          const champ   = st.wb[3][0];
          const tercero = st.tercero;
          const cuarto  = st.cuarto;
          const sl0     = st.semifinal_losers[0];
          const sl1     = st.semifinal_losers[1];
          const fin0    = st.wb[2][0];
          const fin1    = st.wb[2][1];

          const canThird = sl0 && sl1 && !tercero;
          const canFinal = fin0 && fin1 && !champ && !!tercero;
          const mustPlayThirdFirst = fin0 && fin1 && !champ && !tercero && sl0 && sl1;

          // ── Click en cualquier bloque del bracket ──────────────────────────
          function handleMatchClick(e1, e2, etapaLabel) {
            if (!e1 || !e2) return;
            setModal({ e1, e2, etapaLabel });
          }

          function handleFinalClick() {
            if (!canFinal) return;
            setModal({ e1: fin0, e2: fin1, etapaLabel: "GRAN FINAL" });
          }

          function handleThirdClick() {
            if (!canThird) return;
            setModal({ e1: sl0, e2: sl1, etapaLabel: "3ER PUESTO" });
          }

          // ── Elegir ganador ─────────────────────────────────────────────────
          // FIX #4: Usar PARTIDOS constante en lugar de rebuilding buildPartidos(equipos)
          // FIX #5: Usar eqEquals en lugar de JSON.stringify
          function handleChoose(winner, loser) {
            const p = PARTIDOS.find(p => {
              const r1 = resolveTeam(st, p.src1);
              const r2 = resolveTeam(st, p.src2);
              return (eqEquals(r1, winner) && eqEquals(r2, loser))
                  || (eqEquals(r2, winner) && eqEquals(r1, loser));
            });
            if (!p) { setModal(null); return; }
            setHistory(h => [...h, st]);
            const newSt = applyResult(st, p, winner, loser);
            setSt(newSt);
            setLastAction(`${p.etapa}: avanzó ${eqName(winner)}`);
            setModal(null);
          }

          // ── Deshacer ───────────────────────────────────────────────────────
          function undo() {
            if (history.length === 0) return;
            setSt(history[history.length - 1]);
            setHistory(h => h.slice(0, -1));
            setLastAction("Partido deshecho");
          }

          // ── Reiniciar con confirmación ─────────────────────────────────────
          // FIX #9: Pedir confirmación antes de reiniciar
          function reset() {
            if (!window.confirm("¿Reiniciar el torneo? Se perderán todos los resultados.")) return;
            const nuevoSt = initState(equipos);
            setSt(nuevoSt);
            setHistory([]);
            setLastAction("Torneo reiniciado");
          }

          // ── Guardar nombres SIN reiniciar el bracket ───────────────────────
          function saveNames() {
            const newEq = editBuf.map(e => [e[0].trim() || "???", e[1].trim() || "???"]);
            const newSt = remapState(equipos, newEq, st);
            const newHistory = history.map(hSt => remapState(equipos, newEq, hSt));
            setEquipos(newEq);
            setSt(newSt);
            setHistory(newHistory);
            setEditing(false);
            setLastAction("Nombres actualizados ✓");
          }

          // ── Render ─────────────────────────────────────────────────────────
          return (
            <div style={{ background: C.bg, minHeight: "100vh", fontFamily: "'Segoe UI', system-ui, sans-serif", padding: "16px 12px 32px" }}>

              {/* Título */}
              <div style={{ textAlign: "center", marginBottom: 16 }}>
                <div style={{ color: C.title, fontSize: 18, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase" }}>
                  TORNEO 2 VS 2 — ELIMINACIÓN DIRECTA
                </div>
                <div style={{ color: "#5a5a8a", fontSize: 11, marginTop: 3 }}>8 equipos · Cuartos → Semifinal → Final</div>
              </div>

              {/* Botones control — FIX #7: usan clase .btn-ctrl */}
              <div style={{ display: "flex", justifyContent: "center", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
                <button className="btn-ctrl" onClick={() => { setEditBuf(equipos.map(e=>[...e])); setEditing(true); }}>
                  ✎ Editar nombres
                </button>
                <button className="btn-ctrl" onClick={undo} disabled={history.length === 0}>
                  ↩ Deshacer
                </button>
                {/* FIX #9: reset con confirmación */}
                <button className="btn-ctrl" onClick={reset}>
                  ↺ Reiniciar
                </button>
              </div>

              <div style={{ textAlign: "center", color: "#7a7aaa", fontSize: 11, marginBottom: 18, fontStyle: "italic" }}>
                {lastAction}
              </div>

              {/* ── MODAL EDITAR NOMBRES ── */}
              {editing && (
                <div style={{
                  position: "fixed", inset: 0, background: "#000000bb",
                  display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, padding: 16,
                }}>
                  <div style={{
                    background: "#13132a", border: `1.5px solid ${C.azul_bd}`,
                    borderRadius: 14, padding: "24px 20px", maxWidth: 480, width: "100%",
                    maxHeight: "90vh", overflowY: "auto",
                  }}>
                    <div style={{ color: C.title, fontSize: 14, fontWeight: 700, marginBottom: 4 }}>Editar equipos</div>
                    <div style={{ color: "#5a5a8a", fontSize: 11, marginBottom: 16 }}>
                      Los resultados ya registrados se conservan automáticamente.
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                      {editBuf.map((eq, i) => (
                        <div key={i} style={{ background: "#0d0d20", borderRadius: 8, padding: "8px 10px", border: "1px solid #252545" }}>
                          <div style={{ color: "#5a5a8a", fontSize: 10, marginBottom: 6 }}>Equipo {i+1}</div>
                          <input value={eq[0]} onChange={e => setEditBuf(b => b.map((x,j) => j===i ? [e.target.value, x[1]] : x))}
                            placeholder="Jugador 1" style={{
                              width: "100%", background: "#080818", border: "1px solid #222244",
                              color: "#fff", borderRadius: 5, padding: "4px 8px", fontSize: 11, marginBottom: 5, boxSizing: "border-box",
                              fontFamily: "inherit",
                            }} />
                          <input value={eq[1]} onChange={e => setEditBuf(b => b.map((x,j) => j===i ? [x[0], e.target.value] : x))}
                            placeholder="Jugador 2" style={{
                              width: "100%", background: "#080818", border: "1px solid #222244",
                              color: "#fff", borderRadius: 5, padding: "4px 8px", fontSize: 11, boxSizing: "border-box",
                              fontFamily: "inherit",
                            }} />
                        </div>
                      ))}
                    </div>
                    <div style={{ display: "flex", gap: 10, marginTop: 16, justifyContent: "flex-end" }}>
                      <button onClick={() => setEditing(false)} style={{
                        background: "transparent", border: "1px solid #333355", borderRadius: 7,
                        color: "#6666aa", fontSize: 12, padding: "6px 16px", cursor: "pointer", fontFamily: "inherit",
                      }}>Cancelar</button>
                      <button onClick={saveNames} style={{
                        background: C.azul_bg, border: `1.5px solid ${C.azul_bd}`, borderRadius: 7,
                        color: C.azul_tx, fontSize: 12, padding: "6px 16px", cursor: "pointer", fontWeight: 700, fontFamily: "inherit",
                      }}>Guardar nombres</button>
                    </div>
                  </div>
                </div>
              )}

              {/* ── MODAL ¿QUIÉN AVANZA? ── */}
              {modal && (
                <MatchModal
                  eq1={modal.e1} eq2={modal.e2}
                  label={modal.etapaLabel}
                  onChoose={handleChoose}
                  onClose={() => setModal(null)}
                />
              )}

              {/* ── BRACKET PRINCIPAL (scrollable en mobile) ── */}
              <div style={{
                background: C.panelBg, border: "1px solid #1a1a35",
                borderRadius: 14, padding: "16px 12px", marginBottom: 16,
              }}>
                <div className="bracket-scroll">
                  <div className="bracket-inner">
                    {/* LADO IZQUIERDO */}
                    <BracketSide side="left" st={st} onMatchClick={handleMatchClick} />

                    {/* CONECTORES SEMI → FINAL */}
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 56 }}>
                      <svg width="56" height={pairH*2+qGap} style={{ overflow: "visible", display: "block" }}>
                        <line x1="0"  y1={pairH/2+18}           x2="28" y2={pairH/2+18}           stroke={C.line} strokeWidth="1.5"/>
                        <line x1="0"  y1={pairH+qGap+pairH/2+18} x2="28" y2={pairH+qGap+pairH/2+18} stroke={C.line} strokeWidth="1.5"/>
                        <line x1="28" y1={pairH/2+18}           x2="28" y2={pairH+qGap+pairH/2+18} stroke={C.line} strokeWidth="1.5"/>
                        <line x1="28" y1={(pairH/2+pairH+qGap+pairH/2)/2+18} x2="56" y2={(pairH/2+pairH+qGap+pairH/2)/2+18} stroke={C.line} strokeWidth="1.5"/>
                      </svg>
                    </div>

                    {/* ZONA CENTRAL: FINAL + CAMPEÓN */}
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", minWidth: 190 }}>
                      <ColHeader label="Gran Final" color={C.champ_tx} />

                      {mustPlayThirdFirst && (
                        <div style={{
                          color: C.bronze_tx, fontSize: 10, fontWeight: 700,
                          background: C.bronze_bg, border: `1px solid ${C.bronze_bd}44`,
                          borderRadius: 6, padding: "4px 10px", marginBottom: 8, textAlign: "center",
                        }}>
                          ⚠ Primero juega el 3er puesto
                        </div>
                      )}

                      <div style={{ display: "flex", gap: 10, marginBottom: 8 }}>
                        <div
                          onClick={canFinal ? handleFinalClick : undefined}
                          style={{ cursor: canFinal ? "pointer" : "default" }}
                          title={canFinal ? `Final: ${eqName(fin0)} vs ${eqName(fin1)}` : mustPlayThirdFirst ? "Primero juega el 3er puesto" : ""}
                        >
                          <TeamBlock eq={fin0} style={fin0?"final_w":"empty"} width={BW} compact
                            clickable={canFinal} onClick={handleFinalClick} />
                        </div>
                        <div
                          onClick={canFinal ? handleFinalClick : undefined}
                          style={{ cursor: canFinal ? "pointer" : "default" }}
                        >
                          <TeamBlock eq={fin1} style={fin1?"final_w":"empty"} width={BW} compact
                            clickable={canFinal} onClick={handleFinalClick} />
                        </div>
                      </div>

                      {canFinal && (
                        <div onClick={handleFinalClick} style={{
                          color: C.champ_tx, fontSize: 10, fontWeight: 700, cursor: "pointer",
                          background: "#1a1000", border: `1px solid ${C.champ_bd}44`,
                          borderRadius: 6, padding: "3px 10px", marginBottom: 8,
                        }}>★ CLIC PARA JUGAR FINAL ★</div>
                      )}

                      <svg width="2" height={24} style={{ display: "block" }}>
                        <line x1="1" y1="0" x2="1" y2="24" stroke={C.champ_bd} strokeWidth="2"/>
                      </svg>
                      <div style={{ color: C.champ_tx, fontSize: 10, fontWeight: 700, letterSpacing: 2, marginBottom: 6, textTransform: "uppercase" }}>
                        {champ ? "¡CAMPEONES!" : "Campeón"}
                      </div>
                      <ChampBlock eq={champ} width={200} />
                      {champ && <div style={{ color: C.champ_bd, fontSize: 13, marginTop: 6 }}>★ ★ ★</div>}
                    </div>

                    {/* CONECTORES SEMI ← FINAL DERECHA */}
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", width: 56 }}>
                      <svg width="56" height={pairH*2+qGap} style={{ overflow: "visible", display: "block" }}>
                        <line x1="56" y1={pairH/2+18}           x2="28" y2={pairH/2+18}           stroke={C.line} strokeWidth="1.5"/>
                        <line x1="56" y1={pairH+qGap+pairH/2+18} x2="28" y2={pairH+qGap+pairH/2+18} stroke={C.line} strokeWidth="1.5"/>
                        <line x1="28" y1={pairH/2+18}           x2="28" y2={pairH+qGap+pairH/2+18} stroke={C.line} strokeWidth="1.5"/>
                        <line x1="28" y1={(pairH/2+pairH+qGap+pairH/2)/2+18} x2="0"  y2={(pairH/2+pairH+qGap+pairH/2)/2+18} stroke={C.line} strokeWidth="1.5"/>
                      </svg>
                    </div>

                    {/* LADO DERECHO */}
                    <BracketSide side="right" st={st} onMatchClick={handleMatchClick} />
                  </div>
                </div>
              </div>

              {/* ── PANEL INFERIOR: 3er PUESTO + PODIO ── */}
              <div style={{
                background: C.panelBg, border: "1px solid #1a1a35",
                borderRadius: 14, padding: "16px 12px",
                display: "flex", gap: 16, flexWrap: "wrap", justifyContent: "center",
              }}>
                {/* 3ER PUESTO */}
                <div style={{
                  flex: "1 1 300px", background: "#0a0a18",
                  borderRadius: 10, border: "1px solid #1a1a30",
                  padding: "14px 16px", minWidth: 260,
                }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
                    <Medal pos={3} />
                    <div style={{ color: C.bronze_tx, fontSize: 13, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1 }}>
                      3er Puesto
                    </div>
                  </div>

                  <div style={{ display: "flex", gap: 8, justifyContent: "center", alignItems: "center", marginBottom: 10, flexWrap: "wrap" }}>
                    <TeamBlock eq={sl0} style={sl0?"azul":"empty"} width={BW} compact
                      clickable={canThird} onClick={handleThirdClick} />
                    <span style={{ color: "#44446a", fontSize: 12, fontWeight: 700 }}>VS</span>
                    <TeamBlock eq={sl1} style={sl1?"rojo":"empty"} width={BW} compact
                      clickable={canThird} onClick={handleThirdClick} />
                  </div>

                  {canThird && (
                    <div style={{ textAlign: "center" }}>
                      <button onClick={handleThirdClick} style={{
                        background: C.bronze_bg, border: `1px solid ${C.bronze_bd}`,
                        borderRadius: 7, color: C.bronze_tx, fontSize: 11, fontWeight: 700,
                        padding: "5px 14px", cursor: "pointer", fontFamily: "inherit",
                      }}>🥉 Registrar 3er Puesto</button>
                    </div>
                  )}

                  {tercero && (
                    <>
                      <div style={{ textAlign: "center", color: "#44446a", fontSize: 10, margin: "8px 0 6px", textTransform: "uppercase", letterSpacing: 1 }}>Ganador</div>
                      <div style={{ display: "flex", justifyContent: "center" }}>
                        <TeamBlock eq={tercero} style="bronze" width={BW*1.2} compact />
                      </div>
                    </>
                  )}
                </div>

                {/* PODIO */}
                <div style={{
                  flex: "1 1 300px", background: "#0a0a18",
                  borderRadius: 10, border: "1px solid #1a1a30",
                  padding: "14px 16px", minWidth: 260,
                }}>
                  <div style={{ color: C.title, fontSize: 13, fontWeight: 700, textTransform: "uppercase", letterSpacing: 2, textAlign: "center", marginBottom: 14 }}>
                    Podio Final
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                    {[
                      { pos: 1, lbl: "Oro",    eq: champ,   sty: "champ"  },
                      { pos: 2, lbl: "Plata",  eq: sub,     sty: "silver" },
                      { pos: 3, lbl: "Bronce", eq: tercero, sty: "bronze" },
                      { pos: 4, lbl: "4to",    eq: cuarto,  sty: "empty"  },
                    ].map(({ pos, lbl, eq, sty }) => (
                      <div key={pos} style={{
                        display: "flex", alignItems: "center", gap: 10,
                        background: "#0d0d20", borderRadius: 8,
                        padding: "6px 10px", border: "1px solid #18183a",
                      }}>
                        {pos <= 3 ? <Medal pos={pos} /> : (
                          <div style={{ width: 40, textAlign: "center", color: "#5a5a7a", fontSize: 12, fontWeight: 700 }}>4to</div>
                        )}
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <TeamBlock eq={eq} style={sty} width="100%" compact />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* FIX #8: Indicador de guardado automático */}
              <div style={{ textAlign: "center", color: "#2a2a4a", fontSize: 10, marginTop: 12 }}>
                💾 El progreso se guarda automáticamente en este navegador
              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Torneo2vs2 />);
    </script>
    <script src="menu.js"></script>
</body>
</html>
