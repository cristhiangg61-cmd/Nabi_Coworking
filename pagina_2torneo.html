<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bracket · Torneo PVP · Team Crow Power</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --fondo:       #0d0b2b;
      --fondo-2:     #1b1148;
      --oro:         #ffd23f;
      --oro-fuerte:  #ff9e00;
      --azul:        #2ec5ff;
      --rosa:        #ff3d81;
      --texto:       #ffffff;
      --tarjeta:     rgba(255,255,255,0.06);
      --borde:       rgba(255,255,255,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      color: var(--texto);
      background:
        radial-gradient(circle at 20% 0%, rgba(46,197,255,.22), transparent 40%),
        radial-gradient(circle at 80% 10%, rgba(255,61,129,.22), transparent 40%),
        linear-gradient(160deg, rgba(13,11,43,.92), rgba(27,17,72,.92)),
        url('imagenes/WhatsApp Image 2025-06-26 at 10.01.18 PM.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        radial-gradient(2px 2px at 10% 20%, #fff, transparent),
        radial-gradient(2px 2px at 70% 40%, #fff, transparent),
        radial-gradient(1px 1px at 40% 80%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 90% 70%, #fff, transparent);
      opacity: .3; z-index: -1;
      animation: parpadeo 4s ease-in-out infinite alternate;
    }
    @keyframes parpadeo { from{opacity:.15} to{opacity:.45} }

    /* ── NAVBAR ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,11,43,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--borde);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }

    .nav-brand {
      font-family: 'Lilita One', cursive;
      font-size: 1.1rem;
      color: var(--oro);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Links de escritorio */
    .nav-links {
      display: flex;
      gap: 8px;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: #cdd3ff;
      font-weight: 700;
      font-size: .9rem;
      padding: 6px 14px;
      border-radius: 999px;
      transition: background .2s, color .2s;
    }
    .nav-links a:hover,
    .nav-links a.activo {
      background: var(--azul);
      color: #fff;
    }

    /* Botón hamburguesa */
    .hamburguesa {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      background: none;
      border: none;
    }
    .hamburguesa span {
      display: block;
      width: 24px;
      height: 3px;
      background: var(--texto);
      border-radius: 2px;
      transition: transform .3s, opacity .3s;
    }
    .hamburguesa.abierto span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .hamburguesa.abierto span:nth-child(2) { opacity: 0; }
    .hamburguesa.abierto span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    /* Menú desplegable móvil */
    .nav-menu-movil {
      display: none;
      flex-direction: column;
      background: rgba(13,11,43,.97);
      border-bottom: 1px solid var(--borde);
      padding: 12px 20px 16px;
      gap: 8px;
    }
    .nav-menu-movil.visible { display: flex; }
    .nav-menu-movil a {
      text-decoration: none;
      color: #cdd3ff;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 12px;
      transition: background .2s;
    }
    .nav-menu-movil a:hover,
    .nav-menu-movil a.activo {
      background: var(--azul);
      color: #fff;
    }

    @media (max-width: 600px) {
      .nav-links { display: none; }
      .hamburguesa { display: flex; }
    }

    /* ── CONTENIDO PRINCIPAL ── */
    .contenedor {
      max-width: 960px;
      margin: 0 auto;
      padding: 36px 16px 60px;
      text-align: center;
      animation: aparecer .8s ease;
    }

    .titulo-pagina {
      font-family: 'Lilita One', cursive;
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: var(--oro);
      text-shadow: 3px 3px 0 var(--oro-fuerte), 5px 5px 0 rgba(0,0,0,.35);
      margin-bottom: 8px;
    }
    .subtitulo {
      color: #cdd3ff;
      font-size: clamp(.95rem, 2.5vw, 1.1rem);
      font-style: italic;
      margin-bottom: 28px;
    }

    /* ── CONTENEDOR IMAGEN 16:9 ── */
    .bracket-wrapper {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
    }

    .bracket-ratio {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 */
      border-radius: 14px;
      overflow: hidden;
      background: rgba(0,0,0,.3);
    }

    .bracket-ratio img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 14px;
    }

    .bracket-pie {
      margin-top: 14px;
      font-size: .85rem;
      color: #9aa0d4;
    }

    /* ── BOTÓN VOLVER ── */
    .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      text-decoration: none;
      color: #fff;
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 999px;
      padding: 10px 22px;
      font-weight: 700;
      font-size: .95rem;
      transition: background .2s, transform .2s;
    }
    .btn-volver:hover { background: var(--azul); transform: translateY(-3px); }

    @keyframes aparecer { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a class="nav-brand" href="index.html">🐦 Team Crow Power</a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="pagina_2torneo.html" class="activo">Bracket</a></li>
      <li><a href="paginareloj.html">Cuenta atrás</a></li>
    </ul>
    <button class="hamburguesa" id="menuBtn" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- MENÚ MÓVIL -->
  <div class="nav-menu-movil" id="menuMovil">
    <a href="index.html">🏠 Inicio</a>
    <a href="pagina_2torneo.html" class="activo">🏆 Bracket</a>
    <a href="paginareloj.html">⏱️ Cuenta atrás</a>
  </div>

  <!-- CONTENIDO -->
  <div class="contenedor">
    <h1 class="titulo-pagina">🏆 Bracket del Torneo</h1>
    <p class="subtitulo">Cuadro actualizado en tiempo real · Team Crow Power</p>

    <div class="bracket-wrapper">
      <div class="bracket-ratio">
        <img src="imagenes/actual.png" alt="Bracket actual del torneo">
      </div>
      <p class="bracket-pie">📸 Última actualización: revisa este bracket para seguir el torneo en vivo</p>
    </div>

    <a class="btn-volver" href="index.html">← Volver al inicio</a>
  </div>

  <script>
    const btn = document.getElementById('menuBtn');
    const menu = document.getElementById('menuMovil');
    btn.addEventListener('click', () => {
      btn.classList.toggle('abierto');
      menu.classList.toggle('visible');
    });
  </script>

</body>
</html>
