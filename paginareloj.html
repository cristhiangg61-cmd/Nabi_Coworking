<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta Atrás · Torneo PVP · Team Crow Power</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --fondo:       #0d0b2b;
      --fondo-2:     #1b1148;
      --oro:         #ffd23f;
      --oro-fuerte:  #ff9e00;
      --azul:        #2ec5ff;
      --rosa:        #ff3d81;
      --texto:       #ffffff;
      --tarjeta:     rgba(255,255,255,0.06);
      --borde:       rgba(255,255,255,0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      color: var(--texto);
      background:
        radial-gradient(circle at 20% 0%, rgba(46,197,255,.22), transparent 40%),
        radial-gradient(circle at 80% 10%, rgba(255,61,129,.22), transparent 40%),
        linear-gradient(160deg, rgba(13,11,43,.92), rgba(27,17,72,.92)),
        url('imagenes/WhatsApp Image 2025-06-26 at 10.01.18 PM.jpeg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed; inset: 0;
      background-image:
        radial-gradient(2px 2px at 10% 20%, #fff, transparent),
        radial-gradient(2px 2px at 70% 40%, #fff, transparent),
        radial-gradient(1px 1px at 40% 80%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 90% 70%, #fff, transparent);
      opacity: .3; z-index: -1;
      animation: parpadeo 4s ease-in-out infinite alternate;
    }
    @keyframes parpadeo { from{opacity:.15} to{opacity:.45} }

    /* ── NAVBAR ── */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,11,43,.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--borde);
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }

    .nav-brand {
      font-family: 'Lilita One', cursive;
      font-size: 1.1rem;
      color: var(--oro);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links {
      display: flex;
      gap: 8px;
      list-style: none;
    }
    .nav-links a {
      text-decoration: none;
      color: #cdd3ff;
      font-weight: 700;
      font-size: .9rem;
      padding: 6px 14px;
      border-radius: 999px;
      transition: background .2s, color .2s;
    }
    .nav-links a:hover,
    .nav-links a.activo {
      background: var(--azul);
      color: #fff;
    }

    .hamburguesa {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      background: none;
      border: none;
    }
    .hamburguesa span {
      display: block;
      width: 24px;
      height: 3px;
      background: var(--texto);
      border-radius: 2px;
      transition: transform .3s, opacity .3s;
    }
    .hamburguesa.abierto span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
    .hamburguesa.abierto span:nth-child(2) { opacity: 0; }
    .hamburguesa.abierto span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

    .nav-menu-movil {
      display: none;
      flex-direction: column;
      background: rgba(13,11,43,.97);
      border-bottom: 1px solid var(--borde);
      padding: 12px 20px 16px;
      gap: 8px;
    }
    .nav-menu-movil.visible { display: flex; }
    .nav-menu-movil a {
      text-decoration: none;
      color: #cdd3ff;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 12px;
      transition: background .2s;
    }
    .nav-menu-movil a:hover,
    .nav-menu-movil a.activo { background: var(--azul); color: #fff; }

    @media (max-width: 600px) {
      .nav-links { display: none; }
      .hamburguesa { display: flex; }
    }

    /* ── CONTENIDO ── */
    .contenedor {
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 16px 60px;
      text-align: center;
      animation: aparecer .8s ease;
    }

    .titulo-pagina {
      font-family: 'Lilita One', cursive;
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: var(--oro);
      text-shadow: 3px 3px 0 var(--oro-fuerte), 5px 5px 0 rgba(0,0,0,.35);
      margin-bottom: 8px;
    }
    .subtitulo {
      color: #cdd3ff;
      font-size: 1rem;
      font-style: italic;
      margin-bottom: 36px;
    }

    /* ── TARJETA CONTADOR ── */
    .tarjeta-contador {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 24px;
      padding: 36px 24px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
    }

    .fecha-torneo {
      font-size: .9rem;
      color: #9aa0d4;
      margin-bottom: 24px;
      letter-spacing: .5px;
    }
    .fecha-torneo strong { color: var(--azul); }

    /* Bloques de tiempo */
    .bloques {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .bloque {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0,0,0,.35);
      border: 1px solid var(--borde);
      border-radius: 16px;
      padding: 18px 20px 14px;
      min-width: 80px;
      transition: border-color .3s;
    }
    .bloque:hover { border-color: var(--azul); }

    .bloque .numero {
      font-family: 'Lilita One', cursive;
      font-size: clamp(2.2rem, 7vw, 3.2rem);
      color: var(--oro);
      line-height: 1;
      text-shadow: 2px 2px 0 var(--oro-fuerte);
      min-width: 2ch;
      text-align: center;
    }
    .bloque .etiqueta {
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #9aa0d4;
      margin-top: 6px;
    }

    .separador {
      font-family: 'Lilita One', cursive;
      font-size: 2rem;
      color: var(--borde);
      align-self: center;
      margin-bottom: 8px;
    }

    /* Mensaje cuando el torneo comenzó */
    .mensaje-inicio {
      font-family: 'Lilita One', cursive;
      font-size: clamp(1.4rem, 5vw, 2rem);
      color: var(--azul);
      text-shadow: 2px 2px 0 rgba(0,0,0,.3);
      padding: 20px 0;
    }

    /* ── BOTÓN VOLVER ── */
    .btn-volver {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      text-decoration: none;
      color: #fff;
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 999px;
      padding: 10px 22px;
      font-weight: 700;
      font-size: .95rem;
      transition: background .2s, transform .2s;
    }
    .btn-volver:hover { background: var(--azul); transform: translateY(-3px); }

    @keyframes aparecer { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }

    /* Pulso en los números cuando cambia */
    @keyframes pulso {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    .pulso { animation: pulso .25s ease; }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <a class="nav-brand" href="index.html">🐦 Team Crow Power</a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="pagina_2torneo.html">Bracket</a></li>
      <li><a href="paginareloj.html" class="activo">Cuenta atrás</a></li>
    </ul>
    <button class="hamburguesa" id="menuBtn" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <div class="nav-menu-movil" id="menuMovil">
    <a href="index.html">🏠 Inicio</a>
    <a href="pagina_2torneo.html">🏆 Bracket</a>
    <a href="paginareloj.html" class="activo">⏱️ Cuenta atrás</a>
  </div>

  <!-- CONTENIDO -->
  <div class="contenedor">
    <h1 class="titulo-pagina">⏱️ Cuenta Atrás</h1>
    <p class="subtitulo">¿Cuánto falta para el torneo?</p>

    <div class="tarjeta-contador">
      <p class="fecha-torneo" id="fechaTexto">Cargando fecha…</p>

      <div id="contadorVivo">
        <div class="bloques">
          <div class="bloque">
            <span class="numero" id="dias">--</span>
            <span class="etiqueta">Días</span>
          </div>
          <span class="separador">:</span>
          <div class="bloque">
            <span class="numero" id="horas">--</span>
            <span class="etiqueta">Horas</span>
          </div>
          <span class="separador">:</span>
          <div class="bloque">
            <span class="numero" id="minutos">--</span>
            <span class="etiqueta">Min</span>
          </div>
          <span class="separador">:</span>
          <div class="bloque">
            <span class="numero" id="segundos">--</span>
            <span class="etiqueta">Seg</span>
          </div>
        </div>
      </div>
    </div>

    <a class="btn-volver" href="index.html">← Volver al inicio</a>
  </div>

  <script>
    // ────────────────────────────────────────────────
    // ⚠️  CAMBIA ESTA FECHA AL DÍA REAL DEL TORNEO
    //     Formato: new Date(año, mes-1, día, hora, minuto)
    //     Ejemplo: 14 de junio de 2026 a las 17:15
    // ────────────────────────────────────────────────
    const FECHA_TORNEO = new Date(2026, 5, 14, 17, 15, 0); // mes 5 = junio (0-indexado)

    const opciones = {
      weekday: 'long', year: 'numeric', month: 'long',
      day: 'numeric', hour: '2-digit', minute: '2-digit'
    };
    document.getElementById('fechaTexto').innerHTML =
      'Torneo: <strong>' + FECHA_TORNEO.toLocaleDateString('es-ES', opciones) + '</strong>';

    function pad(n) { return String(n).padStart(2, '0'); }

    function actualizar(idAnterior) {
      const ahora     = Date.now();
      const restante  = FECHA_TORNEO.getTime() - ahora;

      if (restante <= 0) {
        document.getElementById('contadorVivo').innerHTML =
          '<p class="mensaje-inicio">🎮 ¡El torneo ya comenzó! ¡Buena suerte a todos!</p>';
        return;
      }

      const dias     = Math.floor(restante / 86400000);
      const horas    = Math.floor((restante % 86400000) / 3600000);
      const minutos  = Math.floor((restante % 3600000)  / 60000);
      const segundos = Math.floor((restante % 60000)    / 1000);

      const nuevoValores = { dias, horas, minutos, segundos };

      for (const [id, valor] of Object.entries(nuevoValores)) {
        const el = document.getElementById(id);
        const nuevo = pad(valor);
        if (el.textContent !== nuevo) {
          el.textContent = nuevo;
          el.classList.remove('pulso');
          void el.offsetWidth; // reflow para reiniciar animación
          el.classList.add('pulso');
        }
      }

      setTimeout(actualizar, 1000);
    }

    actualizar();

    // Menú hamburguesa
    const btn  = document.getElementById('menuBtn');
    const menu = document.getElementById('menuMovil');
    btn.addEventListener('click', () => {
      btn.classList.toggle('abierto');
      menu.classList.toggle('visible');
    });
  </script>

</body>
</html>
